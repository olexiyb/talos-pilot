[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
authors = ["Ken Udovic"]
license = "MIT"
repository = "https://github.com/Handfish/talos-pilot"
homepage = "https://github.com/Handfish/talos-pilot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# gRPC
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
    "tls-ring",
    "tls-native-roots",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# Same version tonic uses; for TCP keepalive tuning of the channel connector
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }

# TLS
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }
rustls-pki-types = "1"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Serialization
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
base64 = "0.23"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
arboard = "3"

# Kubernetes client
kube = { version = "4.2", features = [
    "client",
    "config",
    "runtime",
    "rustls-tls",
], default-features = false }
k8s-openapi = { version = "0.28", features = ["latest"] }

# Certificate parsing
x509-parser = "0.18"

# Internal crates
talos-rs = { path = "crates/talos-rs" }
talos-pilot-core = { path = "crates/talos-pilot-core" }
talos-pilot-tui = { path = "crates/talos-pilot-tui" }

[package]
name = "talos-pilot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A terminal UI for managing and monitoring Talos Linux Kubernetes clusters"

[dependencies]
talos-pilot-tui.workspace = true
talos-rs.workspace = true
clap.workspace = true
tokio.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
